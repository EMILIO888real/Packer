name: Build Windows EXE for Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # Opt-in to Node.js 24 as recommended by GitHub
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller main.spec

      - name: Verify release still exists
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the tag name from the ref
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Checking if release $TAG_NAME exists..."
          
          # Use GitHub CLI to check if the release exists
          if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "::error::Release $TAG_NAME not found. It may have been deleted."
            exit 1
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/packer.exe