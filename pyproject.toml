[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "packer-release"
version = "0.25.0"
description = "A Python automation tool that streamlines python software release workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama",
    "pygithub",
    "requests",
    "platformdirs",
    "GitPython",
    "dirhash",
    "pyinstaller",
    "tomlkit",
    "pyzipper",
    "pyperclip",
    "plyer",
    "argcomplete",
    "pygame",
    "cryptography",
    "tdqm",
    "build",
    "twine",
    "tenacity",
    "pyfiglet"
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
packer = ["assets/**/*"]

[project.scripts]
packer = "packer.main:main"